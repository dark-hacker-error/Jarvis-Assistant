<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JARVIS Particle Orb</title>
<style>
:root{--bg:#fff;--fg:#1d2340;--sub:#6b7390;--glass:rgba(255,255,255,.72);--gb:rgba(255,255,255,.9);--chip:#4a527a;--t1:#2f6bff;--t2:#8b5cf6;--t3:#c15de0;--sh:rgba(70,80,170,.22)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;background:var(--bg);color:var(--fg);font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
header{text-align:center;padding-top:clamp(12px,3.5vh,36px);flex:none}
h1{font-size:clamp(22px,4.2vh,34px);font-weight:700;letter-spacing:.3em;padding-left:.3em;background:linear-gradient(90deg,var(--t1),var(--t2) 60%,var(--t3));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin-top:6px;font-size:clamp(12px,1.8vh,15px);color:var(--sub);letter-spacing:.04em}
#stage{position:relative;flex:1 1 auto;min-height:0;width:100%;max-width:900px}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#shadow{position:absolute;left:50%;height:22px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,var(--sh),transparent);filter:blur(4px);animation:float 5s ease-in-out infinite;pointer-events:none}
@keyframes float{50%{opacity:.6;transform:translateX(-50%) scaleX(.9)}}
#status{flex:none;display:flex;align-items:center;gap:10px;padding:9px 20px;border-radius:999px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 4px 18px rgba(0,0,0,.12),inset 0 0 0 1px var(--gb);font-size:13px;font-weight:600;letter-spacing:.22em;color:var(--fg)}
#dot{width:8px;height:8px;border-radius:50%;background:var(--t1);animation:ping 1.6s infinite}
@keyframes ping{70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.panel{flex:none;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;margin-top:10px;padding:6px;border-radius:20px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 28px rgba(0,0,0,.12),inset 0 0 0 1px var(--gb);max-width:100%}
#panel{margin-bottom:clamp(12px,2.5vh,24px)}
button{font:inherit;font-size:11.5px;font-weight:600;letter-spacing:.1em;border:0;border-radius:13px;padding:10px 13px;color:var(--chip);background:transparent;cursor:pointer;transition:all .2s}
button.on{color:#fff;background:linear-gradient(135deg,var(--t1),var(--t2));box-shadow:0 4px 14px rgba(0,0,0,.25)}
#bgc{width:34px;height:34px;border:0;border-radius:50%;padding:0;background:none;cursor:pointer;overflow:hidden}
#bgc::-webkit-color-swatch-wrapper{padding:0}#bgc::-webkit-color-swatch{border:2px solid var(--gb);border-radius:50%}
#toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);opacity:0;background:#1d2340;color:#fff;font-size:13px;padding:10px 16px;border-radius:12px;transition:all .3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* Hide all HTML panels immediately so they never flash */
#themes,
#panel,
#status,
#toast,
#err,
header {
  display: none !important;
}

html, body {
  height: 100%;
  width: 100%;
  overflow: hidden;
  background: transparent !important;
  background-color: transparent !important;
  padding: 0 !important;
  margin: 0 !important;
  display: flex;
  justify-content: center;
  align-items: center;
}

#stage {
  position: relative;
  width: 100%;
  height: 100%;
  margin: 0 !important;
  padding: 0 !important;
}
</style>
</head>
<body class="embedded">
<div id="stage"><canvas id="c"></canvas><div id="shadow"></div></div>

<script src="three.min.js"></script>
<script>
(function(){
"use strict";
const isEmbedded = true;
if (isEmbedded) {
  document.body.classList.add("embedded");
  document.documentElement.style.background = "transparent";
  document.body.style.background = "transparent";
}

const FOV=45, VIS=3.1, ORBIT=36, COUNT=6000;
const STATES={
  idle:     {scale:1.00,speed:.35,cyan:.35,purple:.45,bright:1.00,glow:.50,ring:.15,wob:0},
  listening:{scale:1.05,speed:.85,cyan:1.00,purple:.25,bright:1.12,glow:.95,ring:.35,wob:0},
  thinking: {scale:1.00,speed:1.55,cyan:.30,purple:1.00,bright:1.05,glow:.75,ring:1.00,wob:1},
  speaking: {scale:1.04,speed:1.15,cyan:.90,purple:.90,bright:1.20,glow:1.00,ring:.45,wob:0}
};
const LABELS={idle:"READY",listening:"LISTENING",thinking:"THINKING...",speaking:"SPEAKING"};
const $=s=>document.querySelector(s);
const stage=$("#stage"),canvas=$("#c"),shadowEl=$("#shadow");

let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:"high-performance"});}
catch(e){$("#err").style.display="block";stage.style.display="none";return;}
renderer.setClearColor(0x000000,0);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(FOV,1,.1,50);
camera.position.set(0,0,6);

/* Shared uniforms */
const U={uTime:{value:0},uAmp:{value:0},uBass:{value:0},uHigh:{value:0},uCyan:{value:.35},uPurple:{value:.45},uBright:{value:1},uPx:{value:300},uCamZ:{value:6},DEEP:{value:new THREE.Color()},BLUE:{value:new THREE.Color()},CYAN:{value:new THREE.Color()},PURP:{value:new THREE.Color()}};
const UNI="uniform float uTime,uAmp,uBass,uHigh,uCyan,uPurple,uBright,uPx,uCamZ;uniform vec3 DEEP,BLUE,CYAN,PURP;";
const PAL="";

/* ---------- 3D particle volume ---------- */
const partV=UNI+PAL+`attribute float aRnd;varying vec3 vC;varying float vA;
void main(){
 float base=length(position);vec3 d=position/base;float t=uTime;
 float n=sin(d.x*3.+t*.8+aRnd*6.)*sin(d.y*3.-t*.6)*sin(d.z*3.+t*.5);
 float r=base*(1.+n*.05+uAmp*.1*aRnd+.015*sin(t*2.+aRnd*20.));
 vec4 mv=modelViewMatrix*vec4(d*r,1.);
 float depth=smoothstep(-1.,1.,mv.z+uCamZ);          /* 0 = back, 1 = front */
 vA=mix(.22,1.,depth);
 vec3 c=mix(BLUE,CYAN,smoothstep(-.5,.9,d.y+n)*uCyan);
 c=mix(c,PURP,smoothstep(.1,.9,d.x*.6-d.y*.3+aRnd*.4)*uPurple);
 c=mix(DEEP,c,.5+.5*aRnd);
 vC=c*uBright*mix(.6,1.,depth);
 gl_PointSize=max((.009+aRnd*.017)*(1.+uAmp*.5)*uPx/(-mv.z)*mix(.85,1.2,depth),1.7);
 gl_Position=projectionMatrix*mv;}`;
const dotF="precision highp float;varying vec3 vC;varying float vA;void main(){float d=length(gl_PointCoord-.5);gl_FragColor=vec4(vC,smoothstep(.5,.05,d)*vA);}";
function buildParticles(){
  const pos=new Float32Array(COUNT*3),rnd=new Float32Array(COUNT);
  for(let i=0;i<COUNT;i++){
    const y=1-2*(i+.5)/COUNT,r=Math.sqrt(1-y*y),th=i*2.39996;
    const shell=.93+.07*Math.random();   /* outer skin + filled interior */
    pos.set([Math.cos(th)*r*shell,y*shell,Math.sin(th)*r*shell],i*3);rnd[i]=Math.random();
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.BufferAttribute(pos,3));g.setAttribute("aRnd",new THREE.BufferAttribute(rnd,1));
  const p=new THREE.Points(g,new THREE.ShaderMaterial({vertexShader:partV,fragmentShader:dotF,uniforms:U,transparent:true,depthWrite:false}));
  p.frustumCulled=false;p.renderOrder=1;return p;
}

const orb=new THREE.Group();
const pointsMesh=buildParticles();
orb.add(pointsMesh);scene.add(orb);

/* ---------- Glow (outer halo only) ---------- */
let glowMat,glow,ring1,ring2,orbitPts,ptData=[];
function createGlow(){
  glowMat=new THREE.ShaderMaterial({
    vertexShader:"varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}",
    fragmentShader:`varying vec2 vUv;uniform float uTime,uStrength,uMix;uniform vec3 uA,uB,uC;
void main(){vec2 c=vUv-.5;float d=length(c)*2.,a=atan(c.y,c.x);
 float g=(d>.68?exp(-(d-.68)*6.5)*.75:0.)*smoothstep(1.,.78,d);
 vec3 col=mix(mix(uA,uB,.5+.5*sin(a+uTime*.4)),uC,uMix*(.5+.5*sin(a*2.-uTime*.6)));
 gl_FragColor=vec4(col,clamp(g*uStrength*.5,0.,.55));}`,
    transparent:true,depthWrite:false,depthTest:false,uniforms:{uTime:{value:0},uStrength:{value:.5},uMix:{value:.3},uA:U.BLUE,uB:U.PURP,uC:U.CYAN}});
  glow=new THREE.Mesh(new THREE.PlaneGeometry(VIS,VIS),glowMat);glow.position.z=-.05;glow.renderOrder=-2;scene.add(glow);
}
function createRing(r0,r1,segs,seed,alpha){
  const m=new THREE.Mesh(new THREE.RingGeometry(r0,r1,128,1),new THREE.ShaderMaterial({
    vertexShader:"varying vec2 vP;void main(){vP=position.xy;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}",
    fragmentShader:`varying vec2 vP;uniform float uAlpha,uSeed,uSegs;uniform vec3 uA,uB,uC;
void main(){float a=atan(vP.y,vP.x);
 float m=smoothstep(-.25,.35,sin(a*uSegs+uSeed))*smoothstep(-.9,-.2,sin(a+uSeed*.7));
 vec3 col=mix(mix(uC,uA,.5+.5*sin(a+uSeed)),uB,.5+.5*sin(a*2.-uSeed));
 gl_FragColor=vec4(col,m*uAlpha);}`,
    transparent:true,depthWrite:false,side:THREE.DoubleSide,uniforms:{uAlpha:{value:alpha},uSeed:{value:seed},uSegs:{value:segs},uA:U.BLUE,uB:U.PURP,uC:U.CYAN}}));
  m.renderOrder=0;scene.add(m);return m;
}
function createParticles(){
  const pos=new Float32Array(ORBIT*3),size=new Float32Array(ORBIT),alpha=new Float32Array(ORBIT),color=new Float32Array(ORBIT*3);
  const pal=[[.1,.7,1],[.2,.4,1],[.55,.3,.95]];
  for(let i=0;i<ORBIT;i++){color.set(pal[i%3],i*3);size[i]=.02+Math.random()*.045;
    ptData.push({a:Math.random()*6.283,r:1.5+Math.random()*.55,sp:(.08+Math.random()*.18)*(Math.random()<.5?-1:1),ph:Math.random()*6.283,tilt:(Math.random()-.5)*1.2,y:(Math.random()-.5)*1.1,fs:.2+Math.random()*.4});}
  const g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.BufferAttribute(pos,3));g.setAttribute("aSize",new THREE.BufferAttribute(size,1));
  g.setAttribute("aAlpha",new THREE.BufferAttribute(alpha,1));g.setAttribute("aColor",new THREE.BufferAttribute(color,3));
  orbitPts=new THREE.Points(g,new THREE.ShaderMaterial({
    vertexShader:"attribute float aSize,aAlpha;attribute vec3 aColor;uniform float uPx;varying float vA;varying vec3 vC;void main(){vA=aAlpha;vC=aColor;vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=max(aSize*uPx/(-mv.z),1.);gl_Position=projectionMatrix*mv;}",
    fragmentShader:dotF,transparent:true,depthWrite:false,uniforms:{uPx:U.uPx}}));
  orbitPts.frustumCulled=false;orbitPts.renderOrder=3;scene.add(orbitPts);
}
createGlow();ring1=createRing(1.255,1.272,2,0,.5);ring2=createRing(1.38,1.388,3,2.1,.3);createParticles();

/* ---------- Themes / background ---------- */
const LIGHTPAL=[[.04,.10,.50],[.12,.32,.95],[.10,.78,1],[.55,.28,.95]];
const THEMES={
 light:{bg:"radial-gradient(120% 80% at 50% 35%,#fff 0%,#f4f6fb 60%,#eceff7 100%)",fg:"#1d2340",sub:"#6b7390",glass:"rgba(255,255,255,.72)",gb:"rgba(255,255,255,.9)",chip:"#4a527a",t:["#2f6bff","#8b5cf6","#c15de0"],add:false,sh:"rgba(70,80,170,.22)",pal:LIGHTPAL},
 dark:{bg:"radial-gradient(120% 80% at 50% 35%,#171c40 0%,#0a0d1f 60%,#04050d 100%)",fg:"#e8ecff",sub:"#8f98c8",glass:"rgba(255,255,255,.07)",gb:"rgba(255,255,255,.12)",chip:"#aab3e6",t:["#5b8cff","#9b7bff","#4fe3ff"],add:true,sh:"rgba(80,120,255,.2)",pal:[[.10,.20,.80],[.25,.50,1],[.30,.92,1],[.70,.45,1]]},
 red:{bg:"radial-gradient(120% 80% at 50% 35%,#2a0a10 0%,#120508 60%,#050203 100%)",fg:"#ffe8ea",sub:"#c98a92",glass:"rgba(255,255,255,.07)",gb:"rgba(255,120,130,.18)",chip:"#f0a8b0",t:["#ff4d5e","#ff2d6f","#ff8a5c"],add:true,sh:"rgba(255,60,80,.2)",pal:[[.55,.05,.10],[.95,.15,.20],[1,.45,.30],[1,.25,.55]]},
 sunset:{bg:"radial-gradient(120% 80% at 50% 35%,#fff6ef 0%,#ffe7e1 60%,#fbd8e8 100%)",fg:"#4a2340",sub:"#98677f",glass:"rgba(255,255,255,.6)",gb:"rgba(255,255,255,.85)",chip:"#7a4566",t:["#ff6a3d","#e83e8c","#8b5cf6"],add:false,sh:"rgba(170,70,110,.22)",pal:[[.55,.12,.45],[.95,.30,.45],[1,.55,.20],[.60,.30,.90]]}
};
let themeName="light";
function setBlend(add){
  [pointsMesh.material,orbitPts.material,glowMat,ring1.material,ring2.material].forEach(m=>{m.blending=add?THREE.AdditiveBlending:THREE.NormalBlending;m.needsUpdate=true;});
}
function applyTheme(name,custom){
  let t=THEMES[name]||THEMES.light;
  if(custom){
    const c=new THREE.Color(custom),L=.299*c.r+.587*c.g+.114*c.b,light=L>.55;
    const hsl={h:0,s:0,l:0};
    c.getHSL(hsl);

    let pal;
    if(hsl.s<.06){
      pal=light?LIGHTPAL:[[.10,.20,.80],[.25,.50,1],[.30,.92,1],[.70,.45,1]];
    }else{
      const h=hsl.h;
      const cDeep=new THREE.Color().setHSL(h,Math.min(1,Math.max(.6,hsl.s*1.2)),Math.max(.1,Math.min(.35,hsl.l*.45)));
      const cMain=new THREE.Color().setHSL(h,Math.max(.85,hsl.s),Math.max(.45,Math.min(.65,hsl.l)));
      const cAcc1=new THREE.Color().setHSL((h+.08)%1.,.95,.65);
      const cAcc2=new THREE.Color().setHSL((h-.08+1.)%1.,.95,.70);
      pal=[
        [cDeep.r,cDeep.g,cDeep.b],
        [cMain.r,cMain.g,cMain.b],
        [cAcc1.r,cAcc1.g,cAcc1.b],
        [cAcc2.r,cAcc2.g,cAcc2.b]
      ];
    }

    const baseTheme=light?THEMES.light:THEMES.dark;
    t=Object.assign({},baseTheme,{
      bg:custom,
      fg:light?"#0f172a":"#ffffff",
      sub:light?"#475569":"#cbd5e1",
      glass:light?"rgba(255,255,255,.65)":"rgba(255,255,255,.14)",
      gb:light?"rgba(255,255,255,.85)":"rgba(255,255,255,.22)",
      chip:light?"#1e293b":"#f1f5f9",
      pal:pal,
      add:!light,
      t:[
        "#"+new THREE.Color(pal[1][0],pal[1][1],pal[1][2]).getHexString(),
        "#"+new THREE.Color(pal[2][0],pal[2][1],pal[2][2]).getHexString(),
        "#"+new THREE.Color(pal[3][0],pal[3][1],pal[3][2]).getHexString()
      ]
    });
    name=null;
  }
  themeName=name||themeName;
  const r=document.documentElement.style;
  if(!isEmbedded){
    r.setProperty("--bg",t.bg);
  }else{
    r.setProperty("--bg","transparent");
    document.documentElement.style.background="transparent";
    document.body.style.background="transparent";
  }
  r.setProperty("--fg",t.fg);r.setProperty("--sub",t.sub);r.setProperty("--glass",t.glass);r.setProperty("--gb",t.gb);r.setProperty("--chip",t.chip);
  r.setProperty("--t1",t.t[0]);r.setProperty("--t2",t.t[1]);r.setProperty("--t3",t.t[2]);r.setProperty("--sh",t.sh);
  ["DEEP","BLUE","CYAN","PURP"].forEach((k,i)=>U[k].value.setRGB(t.pal[i][0],t.pal[i][1],t.pal[i][2]));
  const oc=orbitPts.geometry.attributes.aColor,cols=[t.pal[2],t.pal[1],t.pal[3]];
  for(let i=0;i<ORBIT;i++) oc.setXYZ(i,cols[i%3][0],cols[i%3][1],cols[i%3][2]);
  oc.needsUpdate=true;
  setBlend(t.add);
  document.querySelectorAll("[data-t]").forEach(b=>b.classList.toggle("on",!custom&&b.dataset.t===themeName));
}

/* ---------- State ---------- */
let state="idle";
const cur=Object.assign({},STATES.idle),tgt=Object.assign({},STATES.idle);
function setOrbState(s){
  if(!STATES[s]) return;
  state=s;Object.assign(tgt,STATES[s]);
  const lbl = $("#stext");
  if(lbl) lbl.textContent=LABELS[s] || "READY";
  document.querySelectorAll("[data-s]").forEach(b=>b.classList.toggle("on",b.dataset.s===s));
}

/* ---------- Audio (Simulated, Web mic, or External Native) ---------- */
const audio={level:0,bass:0,high:0};
let actx=null,analyser=null,micStream=null,freq=null,micOn=false;
let externalAudioTime=0;
const extAudio={level:0,bass:0,high:0};

function setExternalAudio(level, bass, high){
  const l = Math.max(0, Math.min(1, Number(level) || 0));
  extAudio.level = l;
  extAudio.bass = Math.max(0, Math.min(1, bass !== undefined && bass !== null ? Number(bass) : l));
  extAudio.high = Math.max(0, Math.min(1, high !== undefined && high !== null ? Number(high) : l));
  externalAudioTime = performance.now();
}

function toast(m){const t=$("#toast");if(!t)return;t.textContent=m;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("show"),2600);}
function updateMicUI(){const b=$("#mic");if(b){b.classList.toggle("on",micOn);b.textContent=micOn?"MIC ON":"MIC TEST";}}
async function startAudioReactive(){
  if(micOn) return true;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    actx=new AC();if(actx.state==="suspended") await actx.resume();
    analyser=actx.createAnalyser();analyser.fftSize=256;analyser.smoothingTimeConstant=.8;
    actx.createMediaStreamSource(micStream).connect(analyser);
    freq=new Uint8Array(analyser.frequencyBinCount);micOn=true;updateMicUI();return true;
  }catch(e){micOn=false;updateMicUI();toast("Microphone unavailable — using simulated audio");return false;}
}
function stopAudioReactive(){
  if(micStream) micStream.getTracks().forEach(t=>t.stop());
  if(actx&&actx.close) actx.close().catch(()=>{});
  micStream=null;actx=null;analyser=null;micOn=false;updateMicUI();
}
function simulateAudio(t){
  let l,b,h;
  if(state==="speaking"){const syl=Math.pow(Math.abs(Math.sin(t*7.3)*Math.sin(t*2.1+1)),.8),gate=Math.sin(t*.9)>-.7?1:.15;l=(.3+.45*syl)*gate;b=l*(.6+.4*Math.sin(t*5));h=l*(.5+.5*Math.sin(t*11));}
  else if(state==="listening"){l=.2+.2*Math.abs(Math.sin(t*3.1)*Math.sin(t*1.3));b=l*.8;h=l*.5;}
  else if(state==="thinking"){l=.12+.07*Math.sin(t*2.2);b=l*.7;h=l*.6;}
  else{l=.05+.03*Math.sin(t*1.1);b=l;h=l*.5;}
  return [l,b,h];
}
function readAudio(t,dt){
  let l,b,h;
  if(performance.now() - externalAudioTime < 220){
    l = extAudio.level;
    b = extAudio.bass;
    h = extAudio.high;
  } else if(micOn&&analyser){
    analyser.getByteFrequencyData(freq);
    const avg=(a,z)=>{let s=0;for(let i=a;i<z;i++)s+=freq[i];return s/((z-a)*255);};
    l=Math.min(avg(0,freq.length)*2.6,1);b=Math.min(avg(0,6)*2.2,1);h=Math.min(avg(48,110)*3,1);
  } else {
    [l,b,h]=simulateAudio(t);
  }
  const k=1-Math.exp(-dt*(l>audio.level?18:6));
  audio.level+=(l-audio.level)*k;audio.bass+=(b-audio.bass)*k;audio.high+=(h-audio.high)*k;
}

/* ---------- Drag to rotate (3D) ---------- */
let dragging=false,px=0,py=0,velX=0,velY=0;
canvas.addEventListener("pointerdown",e=>{dragging=true;px=e.clientX;py=e.clientY;canvas.setPointerCapture(e.pointerId);canvas.style.cursor="grabbing";});
canvas.addEventListener("pointermove",e=>{if(!dragging)return;velY+=(e.clientX-px)*.012;velX+=(e.clientY-py)*.012;px=e.clientX;py=e.clientY;});
const endDrag=()=>{dragging=false;canvas.style.cursor="grab";};
canvas.addEventListener("pointerup",endDrag);canvas.addEventListener("pointercancel",endDrag);

/* ---------- Update ---------- */
let time=0,flow=0,r1a=0,r2a=0,pxPerUnit=300;
function updateOrb(dt){
  const k=1-Math.exp(-dt*3.5);
  for(const key in cur) cur[key]+=(tgt[key]-cur[key])*k;
  time+=dt;flow+=dt*cur.speed;r1a+=dt*(.12+cur.ring*.6);r2a-=dt*(.08+cur.ring*.35);
  readAudio(time,dt);
  const idlePulse=Math.pow(Math.max(0,Math.sin(time*.5)),12)*.15*(1-cur.wob);
  const s=cur.scale*(1+.018*Math.sin(time*1.2)+audio.level*.07+cur.wob*.025*Math.sin(time*3.6));
  orb.scale.setScalar(s);
  orb.rotation.y+=dt*.18*(.5+cur.speed)+velY*Math.min(dt*20,1)*.5;
  orb.rotation.x=Math.max(-1.2,Math.min(1.2,orb.rotation.x+velX*Math.min(dt*20,1)*.5));
  velX*=Math.exp(-dt*5);velY*=Math.exp(-dt*5);
  if(!dragging&&Math.abs(orb.rotation.x)>.001) orb.rotation.x*=Math.exp(-dt*.6);
  U.uTime.value=flow;U.uAmp.value=audio.level+cur.wob*.25;U.uBass.value=audio.bass;U.uHigh.value=audio.high;
  U.uCyan.value=cur.cyan;U.uPurple.value=cur.purple;U.uBright.value=cur.bright+idlePulse;
  glowMat.uniforms.uTime.value=time;glowMat.uniforms.uMix.value=cur.cyan;
  glowMat.uniforms.uStrength.value=cur.glow+audio.level*.6+idlePulse*2;
  const pulse=cur.ring*.5*(.5+.5*Math.sin(time*4))+audio.bass*.8;
  ring1.rotation.z=r1a;ring2.rotation.z=r2a;
  ring1.scale.setScalar(s*(1+pulse*.03));ring2.scale.setScalar(s*(1+pulse*.02));
  ring1.material.uniforms.uAlpha.value=.4+cur.ring*.3+audio.level*.35;
  ring2.material.uniforms.uAlpha.value=.22+cur.ring*.2+audio.level*.2;
  shadowEl.style.width=Math.round(pxPerUnit*1.5*s)+"px";
}
function updateParticles(dt){
  const P=orbitPts.geometry.attributes,boost=.6+cur.speed*.8+(state==="thinking"?1.2:0);
  for(let i=0;i<ORBIT;i++){
    const d=ptData[i];d.a+=d.sp*dt*boost;
    const r=d.r+Math.sin(time*d.fs+d.ph)*.12-(state==="thinking"?.15:0)+audio.level*.1;
    const x=Math.cos(d.a)*r,z=Math.sin(d.a)*r*.6,y=d.y*.8+Math.sin(d.a*1.3+d.ph)*.18+x*d.tilt*.25;
    P.position.setXYZ(i,x,y,z);
    P.aAlpha.setX(i,Math.pow(.5+.5*Math.sin(time*d.fs*1.6+d.ph),1.5)*(.55+cur.glow*.3));
  }
  P.position.needsUpdate=true;P.aAlpha.needsUpdate=true;
}

/* ---------- Resize / loop ---------- */
function handleResize(){
  const w=Math.max(stage.clientWidth,1),h=Math.max(stage.clientHeight,1),pr=Math.min(window.devicePixelRatio,2);
  renderer.setPixelRatio(pr);renderer.setSize(w,h,false);
  camera.aspect=w/h;
  const visH=VIS/Math.min(1,w/h),tan=Math.tan(THREE.MathUtils.degToRad(FOV/2));
  camera.position.z=visH/(2*tan);U.uCamZ.value=camera.position.z;camera.updateProjectionMatrix();
  pxPerUnit=h/visH;U.uPx.value=h*pr/(2*tan);
  shadowEl.style.top=Math.round(h/2+pxPerUnit*1.2)+"px";
}
let last=performance.now();
function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min((now-last)/1000,.05);last=now;
  updateOrb(dt);updateParticles(dt);renderer.render(scene,camera);
}

document.querySelectorAll("[data-s]").forEach(b=>b.addEventListener("click",()=>setOrbState(b.dataset.s)));
document.querySelectorAll("[data-t]").forEach(b=>b.addEventListener("click",()=>applyTheme(b.dataset.t)));
const bgcInput = $("#bgc");
if(bgcInput) bgcInput.addEventListener("input",e=>applyTheme(null,e.target.value));
const micBtn = $("#mic");
if(micBtn) micBtn.addEventListener("click",()=>micOn?stopAudioReactive():startAudioReactive());
window.addEventListener("resize",handleResize);
window.addEventListener("orientationchange",()=>setTimeout(handleResize,200));
if(window.ResizeObserver) new ResizeObserver(handleResize).observe(stage);

window.JarvisOrb={
  setState:setOrbState,
  setTheme:n=>applyTheme(n),
  setBackground:hex=>{
    if(!isEmbedded) document.documentElement.style.setProperty("--bg",hex);
    applyTheme(null,hex);
  },
  setExternalAudio:setExternalAudio,
  startListening:()=>setOrbState("listening"),
  startThinking:()=>setOrbState("thinking"),
  startSpeaking:()=>setOrbState("speaking"),
  stopSpeaking:()=>setOrbState("idle"),
  startAudioReactive:startAudioReactive,
  stopAudioReactive:stopAudioReactive
};

handleResize();
applyTheme("light");
setOrbState("idle");
requestAnimationFrame(animate);
})();
</script>
</body>
